<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Office Worker City</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ctext y=%2726%27 font-size=%2728%27%3E%F0%9F%8C%86%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#1f2540;color:#fff;font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
  .glass{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;text-shadow:0 1px 4px rgba(0,0,0,.35)}
  #hud{position:fixed;left:14px;top:14px;padding:10px 14px;font-size:13px;line-height:1.5;pointer-events:none;display:none}
  #hud b{font-size:15px}
  #status{position:fixed;left:50%;top:14px;transform:translateX(-50%);padding:8px 16px;font-size:13px;display:none;pointer-events:none;text-align:center}
  #login{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 55%,rgba(36,26,70,.50),rgba(36,26,70,.18))}
  #card{width:min(420px,100%);padding:26px;text-align:center}
  #card h1{margin:0 0 6px;font-size:26px}
  #card p{margin:0 0 18px;font-size:13.5px;opacity:.92}
  #name{width:100%;padding:13px 14px;font-size:16px;border-radius:12px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.2);color:#fff;outline:none;text-align:center}
  #name::placeholder{color:rgba(255,255,255,.7)}
  .row{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:13px}
  .row input{flex:1;accent-color:#ffb3cf}
  #sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff}
  #go{width:100%;padding:13px;font-size:16px;font-weight:700;border:none;border-radius:14px;cursor:pointer;background:linear-gradient(135deg,#ffb3cf,#ffd29e);color:#5b2a4a}
  #go[disabled]{opacity:.6;cursor:wait}
  #msg{min-height:20px;margin-top:12px;font-size:13px;color:#ffe9a8}
  #joy{position:fixed;left:22px;bottom:26px;width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4);display:none;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.55)}
  body.touch #joy.on{display:block}
  #help{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);padding:8px 14px;font-size:12.5px;display:none;pointer-events:none;white-space:nowrap}
  body.touch #help{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="glass"><b>🌆 Office Worker City</b><br><span id="cnt">접속 중…</span></div>
<div id="status" class="glass"></div>
<div id="help" class="glass">WASD 이동 · Shift 달리기 · 드래그로 시점 · 휠 줌</div>
<div id="joy"><div id="knob"></div></div>

<div id="login">
  <div id="card" class="glass">
    <h1>🌆 Office Worker City</h1>
    <p>퇴근길에 잠깐 들러 쉬어 가는 라운지 광장이에요.<br>이름을 정하고 들어와 보세요.</p>
    <input id="name" maxlength="12" placeholder="닉네임 (최대 12자)" autocomplete="off">
    <div class="row"><span id="sw"></span><input id="hue" type="range" min="0" max="359" value="200"><span>옷 색</span></div>
    <button id="go">입장하기</button>
    <div id="msg"></div>
  </div>
</div>

<script src="/three.min.js"></script>
<script src="/city.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const isTouch=(matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window);
if(isTouch)document.body.classList.add('touch');
if(typeof THREE==='undefined'){$('#msg').textContent='3D 화면을 불러오지 못했어요. 새로고침해 주세요.';return;}

/* ───── 3D 장면 (2단계: 퇴근길 광장) ───── */
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75));renderer.setSize(innerWidth,innerHeight,false);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.4,700);
const city=buildCity(THREE,scene,renderer);
const blobGeo=new THREE.PlaneGeometry(1.5,1.5);blobGeo.rotateX(-Math.PI/2);
const blobMat=new THREE.MeshBasicMaterial({map:city.blobTex,color:'#241838',transparent:true,opacity:0.5,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4});

/* ───── 아바타 ───── */
function nameSprite(text){
  const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');
  x.font='700 30px system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.lineWidth=7;x.strokeStyle='rgba(40,30,70,.8)';x.strokeText(text,128,34);x.fillStyle='#fff';x.fillText(text,128,34);
  const t=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));
  s.scale.set(2.6,0.65,1);s.position.y=2.35;s.renderOrder=5;return s;
}
function makeAvatar(name,hue){
  const g=new THREE.Group();
  const col=new THREE.Color().setHSL(hue/360,0.55,0.62);
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.42,1.0,12),new THREE.MeshLambertMaterial({color:col}));body.position.y=1.0;g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.32,16,12),new THREE.MeshLambertMaterial({color:'#ffe2d0'}));head.position.y=1.78;g.add(head);
  const hair=new THREE.Mesh(new THREE.SphereGeometry(0.35,16,12,0,Math.PI*2,0,Math.PI*0.55),new THREE.MeshLambertMaterial({color:'#4a3a5c'}));hair.position.y=1.82;hair.rotation.x=-0.2;g.add(hair);
  const legs=[-1,1].map(s=>{const p=new THREE.Group();p.position.set(s*0.14,0.55,0);const m=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.55,8),new THREE.MeshLambertMaterial({color:'#3b3f5c'}));m.position.y=-0.27;p.add(m);g.add(p);return p;});
  const bl=new THREE.Mesh(blobGeo,blobMat);bl.position.y=0.09;bl.renderOrder=2;g.add(bl);
  g.add(nameSprite(name));
  g.userData={legs,body,head};
  scene.add(g);return g;
}
function animateAvatar(a,mv,dt,t){
  const L=a.userData.legs,sw=mv?Math.sin(t*(mv>1?12:8))*(mv>1?0.9:0.6):0;
  L[0].rotation.x=sw;L[1].rotation.x=-sw;
  a.userData.body.position.y=1.0+(mv?Math.abs(Math.sin(t*(mv>1?12:8)))*0.05:Math.sin(t*1.6)*0.01);
}

/* ───── 네트워크 ───── */
let ws=null,myId=0,cfg={tickHz:10,worldRadius:60,maxSpeed:11},joined=false,wantName='',wantHue=200,retry=0,closedByUs=false;
const others=new Map();         // id -> {g,name,x,z,ry,tx,tz,try,mv}
const me={x:0,z:0,ry:0,mv:0,g:null,vx:0,vz:0};
const statusEl=$('#status');
function setStatus(t){if(!t){statusEl.style.display='none';return;}statusEl.textContent=t;statusEl.style.display='block';}
function updateCount(){$('#cnt').textContent='지금 '+(others.size+1)+'명이 함께 있어요';}

function connect(){
  const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
  ws=new WebSocket(url);
  let opened=false;
  ws.onopen=()=>{opened=true;retry=0;setStatus('');ws.send(JSON.stringify({t:'join',name:wantName,hue:wantHue}));};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}onMsg(m);};
  ws.onclose=()=>{
    if(closedByUs)return;
    if(!joined&&!opened){ /* 무료 서버가 잠들어 있으면 처음엔 접속이 느릴 수 있어요 */
      retry++;$('#msg').textContent='서버를 깨우는 중이에요… ('+retry+') 최대 1분 정도 걸릴 수 있어요';
      if(retry<30){setTimeout(connect,2500);}else{$('#msg').textContent='서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.';$('#go').disabled=false;}
      return;
    }
    if(joined){
      setStatus('연결이 끊겼어요. 다시 연결하는 중…');
      clearAll();joined=false;
      if(retry<20){retry++;setTimeout(connect,2000);}else setStatus('연결할 수 없어요. 새로고침해 주세요.');
    }
  };
}
function clearAll(){others.forEach(o=>{scene.remove(o.g);});others.clear();if(me.g){scene.remove(me.g);me.g=null;}}
function addOther(p){
  if(others.has(p.id))return;
  const g=makeAvatar(p.name,p.hue);g.position.set(p.x,0,p.z);g.rotation.y=p.ry;
  others.set(p.id,{g,x:p.x,z:p.z,ry:p.ry,tx:p.x,tz:p.z,try:p.ry,mv:p.mv||0});updateCount();
}
function onMsg(m){
  if(m.t==='welcome'){
    joined=true;myId=m.id;cfg=m.cfg||cfg;
    me.x=m.you.x;me.z=m.you.z;me.ry=0;city.resolve(me,0.38);me.g=makeAvatar(m.you.name,m.you.hue);
    m.players.forEach(addOther);
    $('#login').style.display='none';$('#hud').style.display='block';if(!isTouch)$('#help').style.display='block';
    if(isTouch)$('#joy').classList.add('on');
    updateCount();
  }else if(m.t==='join'){addOther(m.p);}
  else if(m.t==='leave'){const o=others.get(m.id);if(o){scene.remove(o.g);others.delete(m.id);updateCount();}}
  else if(m.t==='s'){
    for(const r of m.p){
      if(r[0]===myId)continue;
      const o=others.get(r[0]);if(!o)continue;
      o.tx=r[1];o.tz=r[2];o.try=r[3];o.mv=r[4];
    }
  }
  else if(m.t==='fix'){me.x=m.x;me.z=m.z;}
  else if(m.t==='full'){closedByUs=true;$('#msg').textContent='지금 라운지가 가득 찼어요. 잠시 후 다시 들어와 주세요.';$('#go').disabled=false;$('#login').style.display='flex';}
  else if(m.t==='idle'){closedByUs=true;setStatus('오래 움직이지 않아 연결이 끊겼어요. 새로고침하면 다시 들어올 수 있어요.');}
}

/* ───── 입력 / 이동 ───── */
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)&&joined)e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
let yaw=0,pitch=0.35,dist=9,drag=null;
canvas.addEventListener('pointerdown',e=>{if(!joined)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY};try{canvas.setPointerCapture(e.pointerId);}catch(_){}});
canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const s=e.pointerType==='touch'?0.0055:0.004;yaw-=(e.clientX-drag.x)*s;pitch=clamp(pitch+(e.clientY-drag.y)*s,0.05,1.3);drag.x=e.clientX;drag.y=e.clientY;});
const endDrag=e=>{if(drag&&e.pointerId===drag.id)drag=null;};
canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=clamp(dist+Math.sign(e.deltaY)*0.8,3,18);},{passive:false});
/* 터치 조이스틱 */
const joy={id:null,x:0,y:0},joyEl=$('#joy'),knob=$('#knob');
function updJoy(e){const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy),mx=r.width/2-10;if(m>mx){dx*=mx/m;dy*=mx/m;}knob.style.transform='translate('+dx+'px,'+dy+'px)';joy.x=dx/mx;joy.y=dy/mx;}
joyEl.addEventListener('pointerdown',e=>{joy.id=e.pointerId;try{joyEl.setPointerCapture(e.pointerId);}catch(_){}updJoy(e);e.preventDefault();});
joyEl.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)updJoy(e);});
const endJoy=e=>{if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0;knob.style.transform='';}};
joyEl.addEventListener('pointerup',endJoy);joyEl.addEventListener('pointercancel',endJoy);

function stepMe(dt){
  let fx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;
  let fz=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y;
  const mag=Math.hypot(fx,fz);if(mag>1){fx/=mag;fz/=mag;}
  const run=keys.ShiftLeft||keys.ShiftRight||(joy.id!==null&&Math.hypot(joy.x,joy.y)>0.9);
  const sp=(run?8.6:4.6)*Math.min(1,mag);
  const s=Math.sin(yaw),c=Math.cos(yaw);
  const tx=(-s*fz+c*fx)*sp,tz=(-c*fz-s*fx)*sp;
  const k=1-Math.exp(-14*dt);me.vx+=(tx-me.vx)*k;me.vz+=(tz-me.vz)*k;
  me.x+=me.vx*dt;me.z+=me.vz*dt;
  city.resolve(me,0.38);
  const r=Math.hypot(me.x,me.z);if(r>cfg.worldRadius){me.x*=cfg.worldRadius/r;me.z*=cfg.worldRadius/r;}
  const hs=Math.hypot(me.vx,me.vz);me.mv=hs>0.4?(hs>6.5?2:1):0;
  if(hs>0.4){const t=Math.atan2(me.vx,me.vz);let d=t-me.ry;d=Math.atan2(Math.sin(d),Math.cos(d));me.ry+=d*(1-Math.exp(-12*dt));}
}
let sendT=0,lastSent={x:1e9,z:1e9,ry:0};
function sendMove(dt){
  sendT+=dt;if(sendT<0.1)return;sendT=0;
  if(!ws||ws.readyState!==1)return;
  if(Math.abs(me.x-lastSent.x)<0.005&&Math.abs(me.z-lastSent.z)<0.005&&Math.abs(me.ry-lastSent.ry)<0.01)return;
  ws.send(JSON.stringify({t:'move',x:+me.x.toFixed(2),z:+me.z.toFixed(2),ry:+me.ry.toFixed(2)}));
  lastSent={x:me.x,z:me.z,ry:me.ry};
}

/* ───── 루프 ───── */
let last=performance.now(),T=0;
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;T+=dt;
  if(joined&&me.g){
    stepMe(dt);sendMove(dt);
    me.g.position.set(me.x,0,me.z);me.g.rotation.y=me.ry;animateAvatar(me.g,me.mv,dt,T);
    others.forEach(o=>{
      const k=1-Math.exp(-10*dt);o.x+=(o.tx-o.x)*k;o.z+=(o.tz-o.z)*k;
      let d=o.try-o.ry;d=Math.atan2(Math.sin(d),Math.cos(d));o.ry+=d*k;
      o.g.position.set(o.x,0,o.z);o.g.rotation.y=o.ry;animateAvatar(o.g,o.mv,dt,T+o.x);
    });
    const cp=Math.cos(pitch);let cd=dist,cx=0,cy=0,cz=0;
    const place=d=>{cx=me.x+Math.sin(yaw)*cp*d;cy=1.6+Math.sin(pitch)*d;cz=me.z+Math.cos(yaw)*cp*d;};
    for(let q=0;q<14;q++){place(cd);if(!city.boxBlocked(cx,cy,cz)&&!city.lineBlocked(me.x,1.5,me.z,cx,cy,cz,false))break;cd*=0.86;}
    place(cd);
    if(city.treeBlocked(cx,cy,cz)||city.lineBlocked(me.x,1.5,me.z,cx,cy,cz,true))cy=Math.min(cy,1.85);   /* 나무 아래로 카메라를 낮춰서 가려지지 않게 */
    cam.position.set(cx,cy,cz);
    cam.lookAt(me.x,1.5,me.z);
  }else{
    yaw+=dt*0.07;cam.position.set(Math.sin(yaw)*30,9,Math.cos(yaw)*30);cam.lookAt(0,4.5,0);
  }
  city.update(dt,T,cam.position);
  renderer.render(scene,cam);
}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();});
requestAnimationFrame(loop);

/* ───── 로그인 화면 ───── */
const hueEl=$('#hue');
const sw=()=>{$('#sw').style.background='hsl('+hueEl.value+',55%,62%)';};hueEl.addEventListener('input',sw);sw();
try{const n=localStorage.getItem('lounge_name');if(n)$('#name').value=n;const h=localStorage.getItem('lounge_hue');if(h){hueEl.value=h;sw();}}catch(_){}
function enter(){
  wantName=$('#name').value.trim();wantHue=parseInt(hueEl.value,10)||0;
  try{localStorage.setItem('lounge_name',wantName);localStorage.setItem('lounge_hue',String(wantHue));}catch(_){}
  $('#go').disabled=true;$('#msg').textContent='접속하는 중…';closedByUs=false;retry=0;connect();
}
$('#go').addEventListener('click',enter);
$('#name').addEventListener('keydown',e=>{if(e.key==='Enter')enter();});
window.__lounge={renderer,get me(){return me;},others,get joined(){return joined;},city,cam,setView(y,p,d){yaw=y;pitch=p;if(d)dist=d;},tp(x,z){me.x=x;me.z=z;me.vx=me.vz=0;}};
})();
</script>
</body>
</html>
