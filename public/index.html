<style>

<body>

<div id="login">
  <div id="card" class="glass">
    <h1>🌆 Office Worker City</h1>
    <p>퇴근길에 잠깐 들러 쉬어 가는 라운지 광장이에요.<br>이름을 정하고 들어와 보세요.</p>

<script src="/three.min.js"></script>
<script src="/cars.js"></script>
<script src="/city.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const isTouch=(matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window);
if(isTouch)document.body.classList.add('touch');
if(typeof THREE==='undefined'){$('#msg').textContent='3D 화면을 불러오지 못했어요. 새로고침해 주세요.';return;}

/* ───── 3D 장면 ───── */
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,isTouch?1.5:1.75));renderer.setSize(innerWidth,innerHeight,false);
const scene=new THREE.Scene();
const FOVS=[68,80,92],fovName=['좁게','기본','넓게(광각)'];let fovI=1;
const cam=new THREE.PerspectiveCamera(FOVS[fovI],innerWidth/innerHeight,0.4,700);
const city=buildCity(THREE,scene,renderer,{touch:isTouch});
const blobGeo=new THREE.PlaneGeometry(1.5,1.5);blobGeo.rotateX(-Math.PI/2);
const blobMat=new THREE.MeshBasicMaterial({map:city.blobTex,color:'#241838',transparent:true,opacity:0.5,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4});

/* 상태 코드: 0 서 있음 · 1 앉음 · 2 누움 · 3 나무 오르는 중 · 4 자동차 탑승 */
const ST={STAND:0,SIT:1,LIE:2,CLIMB:3,RIDE:4};

/* ───── 아바타 ───── */
function nameSprite(text){
  const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');
  x.font='700 30px system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.lineWidth=7;x.strokeStyle='rgba(60,36,70,.85)';x.strokeText(text,128,34);x.fillStyle='#fff';x.fillText(text,128,34);
  const t=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));
  s.scale.set(2.6,0.65,1);s.position.y=2.35;s.renderOrder=5;return s;
}
const EMO=[['👋','인사'],['❤️','하트'],['😄','웃음'],['👏','박수'],['🥱','하품'],['☕','커피'],['🎉','만세'],['💃','춤']];
const UIF='system-ui,"Apple SD Gothic Neo","Malgun Gothic","Noto Color Emoji",sans-serif';
function bubbleSprite(text){
  const c=document.createElement('canvas'),x=c.getContext('2d');
  x.font='700 30px '+UIF;
  const lines=[];let cur='';
  for(const ch of Array.from(text)){if(cur&&x.measureText(cur+ch).width>360){lines.push(cur);cur=ch;}else cur+=ch;}
  lines.push(cur);
  const lw=Math.max.apply(null,lines.map(l=>x.measureText(l).width)),W=Math.ceil(lw)+46,LH=40,H=lines.length*LH+26,TH=16;
  c.width=W;c.height=H+TH;
  x.font='700 30px '+UIF;x.textBaseline='middle';x.textAlign='center';
  x.fillStyle='rgba(255,252,246,.97)';x.strokeStyle='#8a6a9a';x.lineWidth=4;
  const r=22;x.beginPath();x.moveTo(r,2);x.lineTo(W-r,2);x.quadraticCurveTo(W-2,2,W-2,r);x.lineTo(W-2,H-r);x.quadraticCurveTo(W-2,H-2,W-r,H-2);
  x.lineTo(W/2+10,H-2);x.lineTo(W/2,H+TH-2);x.lineTo(W/2-10,H-2);x.lineTo(r,H-2);x.quadraticCurveTo(2,H-2,2,H-r);x.lineTo(2,r);x.quadraticCurveTo(2,2,r,2);x.closePath();x.fill();x.stroke();
  x.fillStyle='#3a2a46';lines.forEach((l,i)=>x.fillText(l,W/2,14+LH*i+LH/2));
  const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));
  sp.center.set(0.5,0);sp.renderOrder=6;const k=0.0072;sp.scale.set(W*k,(H+TH)*k,1);sp.userData.h=(H+TH)*k;return sp;
}
function emoSprite(ch){
  const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  x.font='84px '+UIF;x.textAlign='center';x.textBaseline='middle';x.fillText(ch,64,70);
  const t=new THREE.CanvasTexture(c);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));
  sp.renderOrder=7;sp.scale.set(1.2,1.2,1);return sp;
}
function say(g,text){const U=g.userData;if(U.bub){g.remove(U.bub.sp);U.bub.sp.material.map.dispose();}const sp=bubbleSprite(text);g.add(sp);U.bub={sp,t:performance.now()};}
function emote(g,k){const U=g.userData;if(U.emo){g.remove(U.emo.sp);}const sp=emoSprite(EMO[k][0]);g.add(sp);U.emo={k,sp,t:performance.now()};}
function makeAvatar(name,hue){
  const g=new THREE.Group(),rig=new THREE.Group();g.add(rig);rig.rotation.order='YXZ';
  const col=new THREE.Color().setHSL(hue/360,0.55,0.62),colD=col.clone().multiplyScalar(0.82);
  const T=(c)=>city.toon(c);
  const mBody=T(col),mSkin=T('#ffe2d0'),mHair=T('#4a3a5c'),mPant=T('#3b3f5c'),mShoe=T('#2a2538'),mDark=T('#2b2233'),mBlush=new THREE.MeshBasicMaterial({color:'#ff9aa8',transparent:true,opacity:0.55});
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.42,1.0,14),mBody);body.position.y=1.0;rig.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.32,18,14),mSkin);head.position.y=1.78;rig.add(head);
  const hair=new THREE.Mesh(new THREE.SphereGeometry(0.355,18,14,0,Math.PI*2,0,Math.PI*0.56),mHair);hair.position.y=1.82;hair.rotation.x=-0.2;rig.add(hair);
  const fringe=new THREE.Mesh(new THREE.SphereGeometry(0.2,10,8),mHair);fringe.scale.set(1.5,0.55,0.6);fringe.position.set(0,2.0,0.2);rig.add(fringe);
  [-1,1].forEach(s=>{
    const e=new THREE.Mesh(new THREE.SphereGeometry(0.05,10,8),mDark);e.position.set(s*0.115,1.79,0.292);e.scale.set(1,1.4,0.6);rig.add(e);
    const hl=new THREE.Mesh(new THREE.SphereGeometry(0.017,6,5),new THREE.MeshBasicMaterial({color:'#ffffff'}));hl.position.set(s*0.115+0.014,1.815,0.318);rig.add(hl);
    const b=new THREE.Mesh(new THREE.CircleGeometry(0.06,10),mBlush);b.position.set(s*0.2,1.71,0.275);b.rotation.y=s*0.55;rig.add(b);
  });
  const arms=[-1,1].map(s=>{const p=new THREE.Group();p.position.set(s*0.4,1.42,0);
    const m=new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.065,0.5,8),mBody);m.position.y=-0.25;p.add(m);
    const h=new THREE.Mesh(new THREE.SphereGeometry(0.085,8,6),mSkin);h.position.y=-0.53;p.add(h);rig.add(p);return p;});
  const legs=[-1,1].map(s=>{const p=new THREE.Group();p.position.set(s*0.14,0.55,0);
    const th=new THREE.Mesh(new THREE.CylinderGeometry(0.095,0.085,0.3,8),mPant);th.position.y=-0.14;p.add(th);
    const k=new THREE.Group();k.position.y=-0.28;p.add(k);
    const sh=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.07,0.3,8),mPant);sh.position.y=-0.14;k.add(sh);
    const ft=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.09,0.24),mShoe);ft.position.set(0,-0.3,0.04);k.add(ft);
    rig.add(p);return {p,k};});
  rig.traverse(o=>{if(o.isMesh&&o.material.isMeshToonMaterial){o.castShadow=true;if(o.geometry.type!=='SphereGeometry'||o.geometry.parameters.radius>0.1)city.outline(o);}});
  const bl=new THREE.Mesh(blobGeo,blobMat);bl.position.y=0.09;bl.renderOrder=2;g.add(bl);
  const lab=nameSprite(name);g.add(lab);
  g.userData={rig,body,arms,legs,lab,bl,P:{rigY:0,rotX:0,rigZ:0,tl:0,tr:0,kl:0,kr:0,al:0,ar:0,az:0.06,lab:2.35}};
  scene.add(g);return g;
}
function animateAvatar(a,mv,dt,t,st,y){
  const U=a.userData,P=U.P,T={rigY:0,rotX:0,rigZ:0,tl:0,tr:0,kl:0,kr:0,al:0,ar:0,az:0.06,lab:2.35};
  const air=y>0.14&&st===ST.STAND;
  if(st===ST.SIT||st===ST.RIDE){T.rigY=-0.47;T.tl=T.tr=-1.5;T.kl=T.kr=1.45;T.al=T.ar=st===ST.RIDE?-1.15:-0.5;T.lab=1.95;T.az=0.12;}
  else if(st===ST.LIE){T.rotX=-Math.PI/2;T.rigY=0.42;T.rigZ=0.9;T.az=0.22;T.lab=1.0;}
  else if(st===ST.CLIMB){const c=t*7.5+y*3.2;T.rotX=0.1;T.tl=-0.9+Math.sin(c)*0.6;T.tr=-0.9-Math.sin(c)*0.6;T.kl=1.1;T.kr=1.1;T.al=-2.5+Math.sin(c)*0.5;T.ar=-2.5-Math.sin(c)*0.5;T.az=0.12;}
  else if(air){T.tl=-0.7;T.tr=0.25;T.kl=0.95;T.kr=0.5;T.al=T.ar=-2.5;T.az=0.35;}
  else if(mv){const f=mv>1?12:8,sw=Math.sin(t*f),amp=mv>1?0.95:0.65;T.tl=sw*amp;T.tr=-sw*amp;T.kl=Math.max(0,-sw)*0.95;T.kr=Math.max(0,sw)*0.95;T.al=-sw*amp*0.9;T.ar=sw*amp*0.9;}
  else{T.al=Math.sin(t*1.6)*0.04;T.ar=-Math.sin(t*1.6)*0.04;}
  let extraY=0,rz=0;const nowMs=performance.now();

    else{
      if((st===ST.STAND&&!air&&!mv)||st===ST.SIT){
        if(ek===0){T.ar=-2.9+Math.sin(age*12)*0.3;T.az=0.12;}

        else if(ek===4){T.al=T.ar=-2.6;T.az=0.0;}

        else if(ek===7){const w=age*8;T.al=-1.9+Math.sin(w)*0.9;T.ar=-1.9-Math.sin(w)*0.9;T.az=0.3;rz=Math.sin(age*4)*0.2;
          if(st===ST.STAND){extraY=Math.abs(Math.sin(w))*0.13;T.tl=Math.sin(w)*0.45;T.tr=-Math.sin(w)*0.45;}}
        else if(ek===2&&st===ST.STAND&&age<0.9)extraY=Math.abs(Math.sin(age*9))*0.16;

      const bh=U.bub?U.bub.sp.userData.h+0.15:0;
      sp.position.set(0,P.lab+0.75+bh+Math.min(age,1.4)*0.35+Math.sin(age*3)*0.04,0);sp.scale.setScalar(1.25*Math.max(0.01,ease));sp.material.opacity=fade;
    }
  }
  if(U.bub){
    const age=(nowMs-U.bub.t)/1000,sp=U.bub.sp;
    if(age>6.5){a.remove(sp);sp.material.map.dispose();U.bub=null;}
    else{sp.position.set(0,P.lab+0.38,0);sp.material.opacity=age>5.7?Math.max(0,1-(age-5.7)/0.8):1;}
  }
  U.rig.rotation.z=rz;
  const k=1-Math.exp(-16*dt);for(const n in T)P[n]+=(T[n]-P[n])*k;
  U.rig.position.y=P.rigY+extraY+(mv&&st===0&&!air?Math.abs(Math.sin(t*(mv>1?12:8)))*0.05:0);U.rig.position.z=P.rigZ;U.rig.rotation.x=P.rotX;
  U.legs[0].p.rotation.x=P.tl;U.legs[1].p.rotation.x=P.tr;U.legs[0].k.rotation.x=P.kl;U.legs[1].k.rotation.x=P.kr;
  U.arms[0].rotation.x=P.al;U.arms[1].rotation.x=P.ar;U.arms[0].rotation.z=P.az;U.arms[1].rotation.z=-P.az;
  U.lab.position.y=P.lab;U.bl.position.y=0.09-a.position.y;
}

let ws=null,myId=0,cfg={tickHz:10,worldRadius:60,maxSpeed:15},joined=false,wantName='',wantHue=200,retry=0,closedByUs=false;

function setStatus(t){if(!t){statusEl.style.display='none';return;}statusEl.textContent=t;statusEl.style.display='block';}

function connect(){

  ws=new WebSocket(url);
  let opened=false;
  ws.onopen=()=>{opened=true;retry=0;setStatus('');ws.send(JSON.stringify({t:'join',name:wantName,hue:wantHue}));};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}onMsg(m);};
  ws.onclose=()=>{
    if(closedByUs)return;
    if(!joined&&!opened){ /* 무료 서버가 잠들어 있으면 처음엔 접속이 느릴 수 있어요 */

      if(retry<20){retry++;setTimeout(connect,2000);}else setStatus('연결할 수 없어요. 새로고침해 주세요.');

  else if(m.t==='chat'){
    const g=m.id===myId?(me.g):(others.get(m.id)||{}).g;if(g)say(g,m.x);
    logChat(m.id===myId?me.name:((others.get(m.id)||{}).name||'?'),m.x);
  }

  else if(m.t==='pong'){
    const now=Date.now(),rtt=now-m.c;if(m.s&&rtt>=0&&rtt<=bestRtt+40){bestRtt=Math.min(bestRtt,rtt);srvOff=m.s+rtt/2-now;}

  { let cd=1e9,ci=-1;
    for(const c of carsC){if(!c)continue;const d=Math.hypot(me.x-c.rx,me.z-c.rz);if(d<cd){cd=d;ci=c.id;}}

/* ───── 이동 ───── */
const WALK=6.2,RUN=10.8;
function stepMe(dt){
  /* 자동차 탑승: 위치는 자동차를 따라감 */
  if(me.st===ST.RIDE){
    const c=carsC[me.car];wantJump=false;me.y=CARS.SEAT_Y;me.vx=me.vz=0;me.mv=0;
    if(c){if(me.seat===0)stepDrive(dt,c);const s=CARS.seatAt(c.rx,c.rz,c.rry,me.seat);me.x=s[0];me.z=s[1];me.ry=c.rry;}
    return;
  }
  /* 부드럽게 자리로 이동(벤치 앉기 / 나무 밑동) */
  if(me.snap){
    const s=me.snap,dx=s.x-me.x,dz=s.z-me.z,d=Math.hypot(dx,dz),stp=9*dt;
    if(d>stp){me.x+=dx/d*stp;me.z+=dz/d*stp;}else{me.x=s.x;me.z=s.z;}
    let dr=s.ry-me.ry;dr=Math.atan2(Math.sin(dr),Math.cos(dr));me.ry+=dr*(1-Math.exp(-16*dt));
    me.y+=(s.y-me.y)*(1-Math.exp(-14*dt));
    if(d<=stp&&Math.abs(dr)<0.05){me.x=s.x;me.z=s.z;me.ry=s.ry;me.snap=null;if(me.st===ST.SIT)me.y=s.y;}
    me.mv=0;me.vx=me.vz=0;if(!(me.st===ST.CLIMB))return;
  }
  /* 나무 오르기 / 내려가기 */
  if(me.st===ST.CLIMB){
    const top=treeTop(me.tree);me.mv=0;me.vx=me.vz=0;
    if(me.snap)return;
    if(me.cph==='up'){me.y+=3.3*dt;if(me.y>=top){me.y=top;me.st=ST.SIT;me.cph=null;me.x=me.tree[0];me.z=me.tree[1];}}
    else{me.y-=3.3*dt;if(me.y<=0){me.y=0;me.st=ST.STAND;me.cph=null;me.tree=null;}}
    if(wantJump)wantJump=false;return;
  }
  if(me.st===ST.SIT&&me.tree){me.mv=0;me.vx=me.vz=0;if(wantJump)jumpPressed();return;}
  let fx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;
  let fz=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y;
  const mag=Math.hypot(fx,fz);
  if(wantJump)jumpPressed();
  if(me.st===ST.SIT||me.st===ST.LIE){ /* 걷기 시작하면 일어남 */
    if(mag>0.25){const was=me.st;standUp();}else{me.mv=0;me.vx=me.vz=0;if(me.bench&&!me.snap)me.y=SIT_Y;return;}
  }
  if(mag>1){fx/=mag;fz/=mag;}
  const run=keys.ShiftLeft||keys.ShiftRight||(joy.id!==null&&Math.hypot(joy.x,joy.y)>0.9);
  const sp=(run?RUN:WALK)*Math.min(1,mag);
  const s=Math.sin(yaw),c=Math.cos(yaw);
  const tx=(-s*fz+c*fx)*sp,tz=(-c*fz-s*fx)*sp;
  const k=1-Math.exp(-(me.y>0.01?5:14)*dt);me.vx+=(tx-me.vx)*k;me.vz+=(tz-me.vz)*k;
  me.x+=me.vx*dt;me.z+=me.vz*dt;
  /* 점프 · 중력 */
  if(me.y>0||me.vy!==0){me.vy-=24*dt;me.y+=me.vy*dt;if(me.y<=0){me.y=0;me.vy=0;}}
  city.resolve(me,0.38);
  const r=Math.hypot(me.x,me.z);if(r>cfg.worldRadius){me.x*=cfg.worldRadius/r;me.z*=cfg.worldRadius/r;}
  const hs=Math.hypot(me.vx,me.vz);me.mv=hs>0.4?(hs>8?2:1):0;
  if(hs>0.4){const t=Math.atan2(me.vx,me.vz);let d=t-me.ry;d=Math.atan2(Math.sin(d),Math.cos(d));me.ry+=d*(1-Math.exp(-12*dt));}
}

const carsC=[];const drv={x:0,z:0,ry:0,vx:0,vz:0,sp:0,steer:0,t:0,pf:0};
function mkCar(c){return {id:c[0],x:c[1],z:c[2],ry:c[3],sp:c[4],lights:c[5],color:c[6],driver:c[7],pass:c[8],rx:c[1],rz:c[2],rry:c[3],rsp:c[4],tx:c[1],tz:c[2],tr:c[3],tsp:c[4]};}

  const k=1-Math.exp(-12*dt);

    if(me.st===ST.RIDE&&me.seat===0&&me.car===c.id)continue;
    const ex=c.tx+Math.sin(c.tr)*c.tsp*0.1,ez=c.tz+Math.cos(c.tr)*c.tsp*0.1;
    c.rx+=(ex-c.rx)*k;c.rz+=(ez-c.rz)*k;c.rsp+=(c.tsp-c.rsp)*k;let d=c.tr-c.rry;d=Math.atan2(Math.sin(d),Math.cos(d));c.rry+=d*k;}

function initDrive(id){const c=carsC[id];drv.x=c.rx;drv.z=c.rz;drv.ry=c.rry;drv.vx=Math.sin(c.rry)*c.tsp;drv.vz=Math.cos(c.rry)*c.tsp;drv.sp=c.tsp;drv.steer=0;drv.t=0;
  me.x=drv.x;me.z=drv.z;dist=Math.max(dist,8);}
let touchHB=false;
function stepDrive(dt,c){
  const D=drv;

  let sx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;sx=clamp(sx,-1,1);

  D.t+=dt;if(D.t>0.066){D.t=0;send({t:'drive',x:+D.x.toFixed(2),z:+D.z.toFixed(2),ry:+D.ry.toFixed(3),sp:+D.sp.toFixed(2)});}
}

  else{const col=new THREE.Mesh(new THREE.TorusGeometry(0.16,0.022,6,16),city.toon('#e8564a'));col.position.set(0,-0.14,-0.04);col.rotation.x=1.2;head.add(col);}
  const tail=new THREE.Group();tail.position.set(0,cat?0.4:0.58,cat?-0.34:-0.44);rig.add(tail);
  const tm=new THREE.Mesh(new THREE.CylinderGeometry(cat?0.032:0.04,cat?0.04:0.05,cat?0.44:0.36,7),fur);tm.position.y=cat?0.22:0.18;tail.add(tm);
  const legs=[[-1,1],[1,1],[-1,-1],[1,-1]].map(q=>{const p=new THREE.Group();p.position.set(q[0]*(cat?0.1:0.13),cat?0.26:0.38,q[1]*(cat?0.19:0.27));
    const lm=new THREE.Mesh(new THREE.CylinderGeometry(cat?0.04:0.055,cat?0.035:0.048,cat?0.26:0.38,7),fur);lm.position.y=cat?-0.13:-0.19;p.add(lm);
    const pw=S(cat?0.045:0.06,bel);pw.scale.set(1,0.6,1.3);pw.position.set(0,cat?-0.26:-0.38,0.02);p.add(pw);rig.add(p);return p;});
  g.scale.setScalar(sc);
  g.traverse(o=>{if(o.isMesh&&o.material.isMeshToonMaterial){o.castShadow=true;if(o.geometry.parameters&&(o.geometry.parameters.radius||0)>0.1||o.geometry.type==='CylinderGeometry')city.outline(o);}});
  g.userData={rig,head,tail,legs,cat,P:{y:0,rx:0,hx:0,l:[0,0,0,0],tz:0}};
  scene.add(g);return g;
}
function mkAni(a){
  const info=CARS.ANIMALS[a[0]],g=buildAnimal(info.kind,info.coat,a[0]);
  const lab=nameSprite(info.name);lab.scale.set(1.5,0.38,1);lab.position.y=info.kind==='cat'?1.0:1.4;g.add(lab);g.userData.lab=lab;
  g.position.set(a[1],0,a[2]);
  return {id:a[0],kind:info.kind,name:info.name,g,x:a[1],z:a[2],ry:a[3],tx:a[1],tz:a[2],tr:a[3],mv:a[4],pose:a[5],owner:a[6],fx:null,rod:null};
}
function initWorld(m){
  carsC.length=0;(m.cars||[]).forEach(c=>{carsC[c[0]]=mkCar(c);});
  aniC.forEach(a=>{if(a){scene.remove(a.g);if(a.rod)scene.remove(a.rod);}});aniC.length=0;(m.animals||[]).forEach(a=>{aniC[a[0]]=mkAni(a);});
  poopsC.forEach(q=>scene.remove(q.g));poopsC.clear();(m.poops||[]).forEach(addPoop);
  me.bags=0;me.clean=0;me.leash=-1;updateBagTxt();
}
function applyAnimals(list){for(const r of list){const a=aniC[r[0]];if(!a)continue;a.tx=r[1];a.tz=r[2];a.tr=r[3];a.mv=r[4];a.pose=r[5];a.owner=r[6];}}
const HEART=new Map();
function aniFx(a,e){if(a.fx)a.g.remove(a.fx.sp);const sp=emoSprite(e==='treat'?'🍖':'❤️');a.g.add(sp);a.fx={sp,t:performance.now()};}
function animateAni(a,dt,t){
  const U=a.g.userData,P=U.P,cat=U.cat,T={y:0,rx:0,hx:0,l:[0,0,0,0],tz:0};
  const ph=t*(a.mv>1?14:9)+a.id*1.3;
  if(a.mv){const w=Math.sin(ph)*(a.mv>1?0.85:0.6);T.l=[w,-w,-w,w];T.y=Math.abs(Math.sin(ph))*0.03;}
  if(a.pose===1){T.rx=-0.55;T.y=-0.05;T.l=[0.55,0.55,-1.15,-1.15];T.hx=0.55;}
  else if(a.pose===2){T.y=cat?-0.17:-0.26;T.l=[-1.3,-1.3,-1.2,-1.2];T.hx=cat?0.25:0.3;}
  else if(a.pose===3){T.y=Math.abs(Math.sin(t*10))*0.2;T.l=[0.3,0.3,-0.3,-0.3];T.hx=-0.15;}
  else if(a.pose===4){T.rx=-0.32;T.y=-0.08;T.l=[0.3,0.3,-0.9,-0.9];T.hx=0.3;}
  const wag=Math.sin(t*(a.pose===3||a.owner?12:a.pose===2?1.2:3)+a.id)*(a.pose===2?0.12:0.45);
  T.tz=wag;
  const k=1-Math.exp(-12*dt);P.y+=(T.y-P.y)*k;P.rx+=(T.rx-P.rx)*k;P.hx+=(T.hx-P.hx)*k;P.tz+=(T.tz-P.tz)*Math.min(1,k*2);for(let i=0;i<4;i++)P.l[i]+=(T.l[i]-P.l[i])*k;
  U.rig.position.y=P.y;U.rig.rotation.x=P.rx;U.head.rotation.x=P.hx;U.tail.rotation.z=P.tz;U.tail.rotation.x=a.pose===4?-1.2:(cat?-0.9:-0.7);
  U.legs.forEach((l,i)=>{l.rotation.x=P.l[i];});
  if(a.fx){const age=(performance.now()-a.fx.t)/1000;if(age>1.9){a.g.remove(a.fx.sp);a.fx=null;}else{const sp=a.fx.sp,pp=Math.min(1,age/0.25);sp.position.set(0,(cat?0.9:1.3)+age*0.35,0);sp.scale.setScalar(0.9*(1-Math.pow(1-pp,3)));sp.material.opacity=age>1.4?Math.max(0,1-(age-1.4)/0.5):1;}}
}
const rodGeo=new THREE.CylinderGeometry(0.012,0.012,1,5),rodMat=new THREE.MeshBasicMaterial({color:'#ff5a5a'}),UPV=new THREE.Vector3(0,1,0),dirV=new THREE.Vector3();
function updateAnimals(dt){
  const k=1-Math.exp(-9*dt);
  for(const a of aniC){if(!a)continue;
    a.x+=(a.tx-a.x)*k;a.z+=(a.tz-a.z)*k;let d=a.tr-a.ry;d=Math.atan2(Math.sin(d),Math.cos(d));a.ry+=d*(1-Math.exp(-10*dt));
    const pp={x:a.x,z:a.z};city.resolve(pp,0.3);
    a.g.position.set(pp.x,0,pp.z);a.g.rotation.y=a.ry;animateAni(a,dt,T);
    a.g.userData.lab.visible=Math.hypot(a.x-me.x,a.z-me.z)<14;
    /* 리드줄 */
    let og=null,ox=0,oz=0,oy=0,ory=0;
    if(a.owner){if(a.owner===myId){ox=me.x;oz=me.z;ory=me.ry;oy=me.y;og=1;}else{const o=others.get(a.owner);if(o){ox=o.x;oz=o.z;ory=o.ry;oy=o.y;og=1;}}}
    if(og){if(!a.rod){a.rod=new THREE.Mesh(rodGeo,rodMat);scene.add(a.rod);}
      const hx=ox+Math.sin(ory+1.2)*0.45,hy=oy+0.95,hz=oz+Math.cos(ory+1.2)*0.45;
      const cx=pp.x+Math.sin(a.ry)*0.34,cy=a.kind==='cat'?0.5:0.7,cz=pp.z+Math.cos(a.ry)*0.34;
      dirV.set(cx-hx,cy-hy,cz-hz);const len=dirV.length()||0.01;a.rod.position.set((hx+cx)/2,(hy+cy)/2,(hz+cz)/2);a.rod.scale.set(1,len,1);a.rod.quaternion.setFromUnitVectors(UPV,dirV.normalize());a.rod.visible=true;}
    else if(a.rod)a.rod.visible=false;
  }
  for(const q of poopsC.values()){const age=(performance.now()-q.t)/1000;q.g.scale.setScalar(Math.min(1,age/0.3)*(1+Math.sin(Math.min(age,0.3)/0.3*Math.PI)*0.25));}
}
function nearAni(r){let b=null,bd=r;for(const a of aniC){if(!a)continue;if(a.owner&&a.owner!==myId)continue;const d=Math.hypot(a.x-me.x,a.z-me.z);if(d<bd){bd=d;b=a;}}return b;}
function aniKey(kind){if(!joined||me.st===ST.RIDE)return;const a=nearAni(3.0);if(!a)return;send({t:kind,id:a.id});}
function addPoop(p){
  if(poopsC.has(p[0]))return;
  const g=new THREE.Group(),m1=city.toon('#7b4a2b'),m2=city.toon('#8a5632');
  [[0.16,0.08,m1],[0.12,0.2,m2],[0.075,0.3,m1]].forEach(q=>{const m=new THREE.Mesh(new THREE.SphereGeometry(q[0],10,8),q[2]);m.scale.y=0.7;m.position.y=q[1];m.castShadow=true;g.add(m);});
  const e=new THREE.Mesh(new THREE.SphereGeometry(0.012,5,4),new THREE.MeshBasicMaterial({color:'#fff'}));e.position.set(0.04,0.31,0.06);g.add(e);
  g.position.set(p[1],0,p[2]);g.scale.setScalar(0.01);scene.add(g);poopsC.set(p[0],{g,x:p[1],z:p[2],t:performance.now()});
}
function delPoop(id){const q=poopsC.get(id);if(q){scene.remove(q.g);poopsC.delete(id);}}
function updateBagTxt(){
  const a=aniC.find(x=>x&&x.owner===myId);
  $('#bagtxt').textContent=[a?'🐕 '+a.name+'와 산책 중':'',(me.bags||me.clean)?'🧻 '+(me.bags||0)+' · 🧹 '+(me.clean||0):''].filter(Boolean).join(' · ');
}

/* ───── 시간대(서버 시간 기준 동기화: 36분 = 하루) ───── */
const DAY_MS=36*60*1000,TQ=new URLSearchParams(location.search).get('t');
function todHour(){if(TQ!==null&&!isNaN(+TQ))return +TQ;return ((Date.now()+srvOff)%DAY_MS)/DAY_MS*24;}
let lastTod=0,lastClock='';
function updateTime(now){
  if(now-lastTod<120)return;lastTod=now;
  const h=todHour();city.setTime(h);
  const hh=Math.floor(h),mm=Math.floor((h-hh)*60),ap=hh<12?'오전':'오후',h12=hh%12===0?12:hh%12;
  const icon=h>=5&&h<7.5?'🌅':h<17.5&&h>=7.5?'☀️':h<19.8&&h>=17.5?'🌇':'🌙';
  const t=' · '+icon+' '+ap+' '+h12+':'+(mm<10?'0':'')+mm;if(t!==lastClock){lastClock=t;$('#clock').textContent=t;}
}

/* 느린 기기에서는 화면 효과를 자동으로 줄여요 */
let qFrames=0,qT=0,qDone=/nopost/.test(location.search);
function autoQuality(dt){
  if(qDone||!joined)return;
  qFrames++;qT+=dt;if(qT<5)return;
  const fps=qFrames/qT;qDone=true;
  if(fps<22){city.setPost(false);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1));toast('기기에 맞춰 화면 효과를 줄였어요');}
}

/* ───── 루프 ───── */
let last=performance.now(),T=0;
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;T+=dt;
  updateTime(now);autoQuality(dt);
  if(joined&&me.g){
    stepMe(dt);sendMove(dt);
    me.g.position.set(me.x,me.y,me.z);me.g.rotation.y=me.ry;animateAvatar(me.g,me.mv,dt,T,me.st,me.y);
    renderCars(dt);updateAnimals(dt);
    others.forEach((o,oid)=>{
      const k=1-Math.exp(-10*dt);o.x+=(o.tx-o.x)*k;o.z+=(o.tz-o.z)*k;o.y+=(o.ty-o.y)*(1-Math.exp(-14*dt));
      let d=o.try-o.ry;d=Math.atan2(Math.sin(d),Math.cos(d));o.ry+=d*k;
      if(o.st===ST.RIDE){const c=carsC.find(q=>q&&(q.driver===oid||q.pass===oid));if(c){const s=CARS.seatAt(c.rx,c.rz,c.rry,c.driver===oid?0:1);o.x=s[0];o.z=s[1];o.ry=c.rry;o.y=CARS.SEAT_Y;}}
      o.g.position.set(o.x,o.y,o.z);o.g.rotation.y=o.ry;animateAvatar(o.g,o.mv,dt,T+o.x,o.st,o.y);
    });
    if(me.st===ST.RIDE&&performance.now()-lastDrag>2200){let d=me.ry+Math.PI-yaw;d=Math.atan2(Math.sin(d),Math.cos(d));yaw+=d*(1-Math.exp(-2.6*dt));}
    { const spd=me.st===ST.RIDE?Math.abs(carsC[me.car]?carsC[me.car].rsp:0):0,ft=FOVS[fovI]+Math.min(14,spd*0.5);if(Math.abs(cam.fov-ft)>0.05){cam.fov+=(ft-cam.fov)*Math.min(1,dt*4);cam.updateProjectionMatrix();} }
    const cp=Math.cos(pitch);let cd=dist,cx=0,cy=0,cz=0;const ty=me.y+1.5;
    const place=d=>{cx=me.x+Math.sin(yaw)*cp*d;cy=me.y+1.6+Math.sin(pitch)*d;cz=me.z+Math.cos(yaw)*cp*d;};
    for(let q=0;q<14;q++){place(cd);if(!city.boxBlocked(cx,cy,cz)&&!city.lineBlocked(me.x,ty,me.z,cx,cy,cz,false))break;cd*=0.86;}
    place(cd);
    if(!me.tree&&(city.treeBlocked(cx,cy,cz)||city.lineBlocked(me.x,ty,me.z,cx,cy,cz,true)))cy=Math.min(cy,me.y+1.85);   /* 나무 아래로 카메라를 낮춰서 가려지지 않게 */
    cam.position.set(cx,cy,cz);
    cam.lookAt(me.x,ty,me.z);
    city.setPlayer(me.x,me.y,me.z);
    updatePrompt();
  }else{
    yaw+=dt*0.07;cam.position.set(Math.sin(yaw)*30,9,Math.cos(yaw)*30);cam.lookAt(0,4.5,0);
  }
  city.update(dt,T,cam.position,carTime());
  city.render(cam);
}
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();city.resize();});
requestAnimationFrame(loop);

/* ───── 로그인 화면 ───── */
const hueEl=$('#hue');
const sw=()=>{$('#sw').style.background='hsl('+hueEl.value+',55%,62%)';};hueEl.addEventListener('input',sw);sw();
try{const n=localStorage.getItem('lounge_name');if(n)$('#name').value=n;const h=localStorage.getItem('lounge_hue');if(h){hueEl.value=h;sw();}}catch(_){}
function enter(){
  wantName=$('#name').value.trim();wantHue=parseInt(hueEl.value,10)||0;
  try{localStorage.setItem('lounge_name',wantName);localStorage.setItem('lounge_hue',String(wantHue));}catch(_){}
  $('#go').disabled=true;$('#msg').textContent='접속하는 중…';closedByUs=false;retry=0;connect();
}
$('#go').addEventListener('click',enter);
$('#name').addEventListener('keydown',e=>{if(e.key==='Enter')enter();});
window.__lounge={carsC,aniC,poopsC,drv,send,sendEmote,renderer,get me(){return me;},others,get joined(){return joined;},city,cam,ST,interact,toggleSit,toggleLie,jump(){wantJump=true;},carTime,findTarget,keys,setView(y,p,d){yaw=y;pitch=p;if(d)dist=d;},tp(x,z){me.x=x;me.z=z;me.vx=me.vz=0;}};
})();
